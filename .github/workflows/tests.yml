name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  phpcs:
    name: Coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-progress
      - run: composer run phpcs

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-progress
      - run: composer run test

  plugin-check:
    name: WordPress Plugin Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same exclusions as .distignore -- checks the plugin the way it'll
      # actually ship, not the dev repo (tests/ deliberately uses eval()
      # and direct filesystem calls that Plugin Check rightly flags, but
      # none of that reaches WordPress.org's SVN distribution).
      - uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: 'tests,.github,vendor,.wordpress-org,.git,bin,dist'
          exclude-files: 'composer.json,composer.lock,.phpcs.xml.dist,.phpunit.result.cache,phpunit.xml.dist,.gitignore,.distignore,README.md'

  release:
    name: Build & publish release zip
    needs: [phpcs, phpunit, plugin-check]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build plugin zip
        run: VERSION="${GITHUB_REF_NAME#v}" bin/build-zip.sh dist
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
